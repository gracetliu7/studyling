<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="dropdown.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../../src/theme.js" type="module"></script>
    <script type="module" src="../../src/todo-list.js" type="module"></script>
    <script type="module" src="../../src/time-display-visibility.js" type="module"></script>
    <title>studyling</title>
</head>

<body>
    <div id="center-container">
    <div id="clock-wrapper">
        <iframe src="../../public/time-display/time-display.html" id="clock-display" style="display: none;"
            height="200px" width="275px"></iframe>
        <iframe src="../../public/timers/timer.html" id="timer-display" style="display: none;"
            height="200px" width="350px"></iframe>
    </div>
    <div class="container">
        <header>
            <h1>To Do List</h1>
            <p class="subtitle">one task at a time! you can do it! ♡ </p>
            <div class="buttons">
                <button class="tags-btn" onclick="window.location.href='tags.html'"></button>
                <button class="time-display-btn" id="time-display"></button>
                <button class="history-btn" onclick="window.location.href='history.html'"></button>
                <button class="settings-btn" onclick="window.location.href='../settings/settings.html'"></button>
            </div>
        </header>
        <div class="app-body">
            <div class="input-container">
                <input type="text" id="new-task" placeholder="enter a new task">
                <button id="add-task" aria-label="Add task"></button>
            </div>
            <div class="tag-input-container">
                <input type="text" id="tag-input" placeholder="enter tags, comma separated">
                <div class="custom-dropdown">
                    <button type="button" id="exist-tag-button" class="dropdown-button" >or pick an existing tag</button>
                    <div id="exist-tag-dropdown" class="dropdown-content">
                        <div class="dropdown-placeholder">
                        </div>
                    </div>
                </div>
            </div>

            <ul id="task-list"></ul>

            <div class="stats">
                <span id="total-tasks">Total: 0 tasks</span>
                <button id="clear-tasks">Clear all completed tasks</button>
                <span id="completed-tasks">Completed: 0</span>
            </div>
            </div>
        </div>
        <div class="footer">
            <div class="footer-left">
                <p>made with ♡ by gracie</p>
                <button id="learn-more" onclick="window.location.href='../about/about-page.html'">learn more</button>
                <p>© 2025</p>
            </div>
            <div id="ko-fi-container">
                <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('support me on Ko-fi ', '#e8d3e3', 'A0A41JLFT5');kofiwidget2.draw();</script> 
            </div>
        </div>
    </div>
</body>

</html>

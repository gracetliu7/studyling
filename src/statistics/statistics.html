<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="statistics.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Study Statistics</h1>
        </header>
        <div class="stats-container">
            <div class="stat-card">
                <h2>Today</h2>
                <p id="today-stats">0 minutes</p>
            </div>
            <div class="stat-card">
                <h2>This Week</h2>
                <p id="week-stats">0 minutes</p>
            </div>
            <div class="stat-card">
                <h2>This Month</h2>
                <p id="month-stats">0 minutes</p>
            </div>
            <div class="stat-card">
                <h2>Total</h2>
                <p id="total-stats">0 minutes</p>
            </div>
        </div>
        <div class="footer">
            <button class="back-btn" onclick="window.location.href='../todo-list/todo-list.html'">Back to To-Do List</button>
        </div>
    </div>
    <script type="module" src="data.js"></script>
    <script type="module" src="statistics.js"></script>
</body>
</html>

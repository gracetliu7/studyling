<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>to do list</h1>
            <p class="subtitle">one task at a time! you can do it! ♡ </p>
            <div class="buttons">
                <button id="tags-btn" class="tags-btn"></button>
                <button id="history-btn" class="history-btn"
                    onclick="window.location.href='todo-list-history.html'"></button>
                <button id="settings-btn" class="settings-btn"></button>
            </div>
        </header>
        <div class="app-body">
            <div class="input-container">
                <input type="text" id="new-task" placeholder="Enter a new task">
                <button id="add-task"></button>
            </div>

            <ul id="task-list"></ul>

            <div class="stats">
                <span id="total-tasks">Total: 0 tasks</span>
                <span id="completed-tasks">Completed: 0</span>
            </div>
        </div>
    </div>
</body>

</html>
